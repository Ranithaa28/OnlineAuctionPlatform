spring.application.name=auction
# Server Configuration (PaaS cloud providers like Render/Railway dynamically inject $PORT)
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auction_platform}
spring.datasource.username=${DB_USERNAME:auction_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Disable open-in-view
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.hibernate.SQL=${LOG_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_BINDER:WARN}
logging.level.org.springframework.web=INFO

# Jackson Configuration
spring.jackson.time-zone=Asia/Kolkata

# Brevo SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:b6590e001@smtp-brevo.com}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

jwt.secret=${JWT_SECRET:your_very_long_secure_default_secret_key_that_is_at_least_256_bits_long_1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

